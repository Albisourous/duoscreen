name: DuoScreen
options:
  bundleIdPrefix: com.albisourous
targets:
  DuoScreen:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: DuoScreen
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.albisourous.duoscreen
        DEVELOPMENT_TEAM: Q36L58HTT5
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: DuoScreen/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
  DuoScreenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DuoScreenUITests
    dependencies:
      - target: DuoScreen
    settings:
      base:
        TEST_TARGET_NAME: DuoScreen
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DuoScreen:
    build:
      targets:
        DuoScreen: all
    test:
      targets:
        - DuoScreenUITests
